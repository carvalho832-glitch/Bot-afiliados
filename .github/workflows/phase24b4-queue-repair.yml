name: Fase 24B.4 Reparo da fila

on:
  push:
    branches:
      - 'agent/phase24b4-queue-repair'
      - 'fix/phase24b4-bootstrap-v6'
      - 'fix/phase24b4-direct-top-level'
    paths:
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v5.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v6.js'
      - 'radar/achou-levou-direct-v7.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - '.github/workflows/phase24b4-queue-repair.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v5.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v6.js'
      - 'radar/achou-levou-direct-v7.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - '.github/workflows/phase24b4-queue-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar sintaxe e configuração
        run: |
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v5.js
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v6.js
          python3 -m json.tool radar/config.json >/dev/null
          python3 -m json.tool radar/classic-config.json >/dev/null
          grep -n '2026.08.05.3-phase24b4-direct-v7' radar/config.json
          grep -n 'classic-2026.08.05.14-phase24b4-direct-v7' radar/classic-config.json
          grep -n 'classic-achou-levou-phase24b4-entry-v6.js?v=2' radar/classic-config.json
          grep -n 'achou-levou-direct-v7.html?v=2' radar/config.json
          grep -n 'classic-achou-levou-phase24b4-entry-v6.js?v=2' radar/achou-levou-direct-v7.html

      - name: Validar abertura direta e recuperação
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b4-entry-v6.js
          DIRECT=radar/achou-levou-direct-v7.html
          grep -n '/shared/offers' "$MODULE"
          grep -n 'syntheticSourceId' "$MODULE"
          grep -n 'shared-fallback' "$MODULE"
          grep -n 'annotateSharedOffers' "$MODULE"
          grep -n 'phase24B4V6Diagnostics' "$MODULE"
          grep -n 'phase24B4Review' "$MODULE"
          grep -n '<base href="../">' "$DIRECT"
          grep -n 'phase24b4-direct-v7' "$DIRECT"
          ! grep -n '<iframe' "$DIRECT"

      - name: Garantir operação supervisionada
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b4-entry-v6.js
          grep -n 'autoStart: false' "$MODULE"
          grep -n 'whatsappSend: false' "$MODULE"
          grep -n '"phase24AutoStart": false' radar/classic-config.json
          grep -n '"phase24AutoTransfer": false' radar/classic-config.json
          ! grep -nE '/(queue/start|fila/iniciar|bot/start|send-controlado)' "$MODULE"

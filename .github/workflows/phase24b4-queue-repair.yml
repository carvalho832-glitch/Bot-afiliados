name: Fase 24B.4 Reparo da fila

on:
  push:
    branches:
      - 'fix/phase24b4-review-source-v10'
      - 'fix/review-source-direct-v12'
    paths:
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v10.js'
      - 'radar/achou-levou-direct-v10.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - 'api/bot-review-source-preload.js'
      - 'api/package.json'
      - 'whatsapp-bot/server.js'
      - 'whatsapp-bot/start-production.sh'
      - 'whatsapp-bot/package.json'
      - '.github/workflows/phase24b4-queue-repair.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v10.js'
      - 'radar/achou-levou-direct-v10.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - 'api/bot-review-source-preload.js'
      - 'api/package.json'
      - 'whatsapp-bot/server.js'
      - 'whatsapp-bot/start-production.sh'
      - 'whatsapp-bot/package.json'
      - '.github/workflows/phase24b4-queue-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar sintaxe e releases
        run: |
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v10.js
          node --check api/bot-review-source-preload.js
          node --check whatsapp-bot/server.js
          bash -n whatsapp-bot/start-production.sh
          python3 -m json.tool radar/config.json >/dev/null
          python3 -m json.tool radar/classic-config.json >/dev/null
          python3 -m json.tool api/package.json >/dev/null
          python3 -m json.tool whatsapp-bot/package.json >/dev/null
          grep -n '2026.08.05.6-phase24b4-review-source-v10' radar/config.json
          grep -n 'classic-2026.08.05.17-phase24b4-review-source-v10' radar/classic-config.json
          grep -n 'classic-achou-levou-phase24b4-entry-v10.js?v=1' radar/classic-config.json
          grep -n 'achou-levou-direct-v10.html?v=1' radar/config.json

      - name: Validar fonte segura e recuperação
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b4-entry-v10.js
          grep -n '/bot/queue/review-source' "$MODULE"
          grep -n 'recoverFromSource' "$MODULE"
          grep -n 'recoverThenReview' "$MODULE"
          grep -n 'installButtonHandler' "$MODULE"
          grep -n 'stopImmediatePropagation' "$MODULE"
          grep -n 'phase24b4-review-source-v10' "$MODULE"
          grep -n "status: 'sent'" "$MODULE"
          grep -n "app.get('/queue/review-source'" whatsapp-bot/server.js
          grep -n 'fallbackToLatest' whatsapp-bot/server.js
          grep -n 'exec node server.js' whatsapp-bot/start-production.sh
          ! grep -n -- '--import ./review-source-preload.mjs' whatsapp-bot/start-production.sh
          grep -n '/bot/queue/review-source' api/bot-review-source-preload.js

      - name: Garantir operação supervisionada
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b4-entry-v10.js
          grep -n 'autoStart: false' "$MODULE"
          grep -n 'whatsappSend: false' "$MODULE"
          grep -n '"phase24AutoStart": false' radar/classic-config.json
          grep -n '"phase24AutoTransfer": false' radar/classic-config.json
          ! grep -nE '/(queue/add|queue/start|fila/iniciar|bot/start|send-controlado)' "$MODULE"
          ! grep -n 'transferOffers' "$MODULE"

name: Fase 24B.4 Recuperação Inline

on:
  push:
    branches:
      - 'fix/phase24b4-inline-recovery'
      - 'agent/phase24b4-queue-repair'
      - 'fix/phase24b4-bootstrap-v6'
      - 'fix/phase24b4-direct-top-level'
      - 'fix/phase24b4-bot-queue-recovery-v8'
    paths:
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v4.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v5.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v6.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v8.js'
      - 'radar/achou-levou-direct-v7.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - '.github/workflows/phase24b4-inline-recovery.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v4.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v5.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v6.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v8.js'
      - 'radar/achou-levou-direct-v7.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - '.github/workflows/phase24b4-inline-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: |
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v4.js
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v5.js
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v6.js
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v8.js

      - name: Validar configuração remota
        run: |
          python3 -m json.tool radar/config.json >/dev/null
          python3 -m json.tool radar/classic-config.json >/dev/null
          grep -n '2026.08.05.4-phase24b4-bot-queue-v8' radar/config.json
          grep -n 'classic-2026.08.05.15-phase24b4-bot-queue-v8' radar/classic-config.json
          grep -n 'classic-achou-levou-phase24b4-entry-v8.js?v=1' radar/classic-config.json
          grep -n 'achou-levou-direct-v7.html?v=3' radar/config.json
          grep -n '"phase24InlineRecovery": true' radar/classic-config.json
          grep -n '"phase24SharedQueueFallback": true' radar/classic-config.json
          grep -n '"phase24BotQueueRecoveryV8": true' radar/classic-config.json

      - name: Validar fontes de recuperação
        run: |
          MODULE5=radar/modules/classic-achou-levou-phase24b4-entry-v5.js
          MODULE6=radar/modules/classic-achou-levou-phase24b4-entry-v6.js
          MODULE8=radar/modules/classic-achou-levou-phase24b4-entry-v8.js
          grep -n '/phase24/batches' "$MODULE5"
          grep -n '/shared/offers' "$MODULE5"
          grep -n 'scanStorage(localStorage' "$MODULE5"
          grep -n 'scanStorage(sessionStorage' "$MODULE5"
          grep -n 'installSharedOffersBridge' "$MODULE5"
          grep -n 'syntheticSourceId' "$MODULE6"
          grep -n 'annotateSharedOffers' "$MODULE6"
          grep -n 'queueItemsFromOverview' "$MODULE8"
          grep -n 'writeRecoveredLocally' "$MODULE8"
          grep -n 'installRecoveredFetchBridge' "$MODULE8"
          grep -n 'phase24b4-direct-v8' radar/achou-levou-direct-v7.html
          ! grep -n '<iframe' radar/achou-levou-direct-v7.html

      - name: Garantir operação supervisionada
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b4-entry-v8.js
          grep -n 'supervised: true' "$MODULE"
          grep -n 'autoStart: false' "$MODULE"
          grep -n 'whatsappSend: false' "$MODULE"
          grep -n 'alreadyQueuedItemsMarkedSent: true' "$MODULE"
          ! grep -nE '/(queue/add|queue/start|fila/iniciar|bot/start|send-controlado)' "$MODULE"

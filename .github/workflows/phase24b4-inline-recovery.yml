name: Fase 24B.4 Recuperação Inline

on:
  push:
    branches:
      - 'fix/phase24b4-direct-queue-v9'
    paths:
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v9.js'
      - 'radar/achou-levou-direct-v9.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - '.github/workflows/phase24b4-inline-recovery.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v9.js'
      - 'radar/achou-levou-direct-v9.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - '.github/workflows/phase24b4-inline-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar arquivos
        run: |
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v9.js
          python3 -m json.tool radar/config.json >/dev/null
          python3 -m json.tool radar/classic-config.json >/dev/null
          grep -n '2026.08.05.5-phase24b4-direct-queue-v9' radar/config.json
          grep -n 'classic-2026.08.05.16-phase24b4-direct-queue-v9' radar/classic-config.json
          grep -n 'classic-achou-levou-phase24b4-entry-v9.js?v=1' radar/classic-config.json
          grep -n 'achou-levou-direct-v9.html?v=1' radar/config.json
          grep -n '"phase24DirectBotQueueV9": true' radar/classic-config.json
          grep -n '"phase24RecoverBeforeReview": true' radar/classic-config.json

      - name: Validar leitura e recuperação
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b4-entry-v9.js
          grep -n '/bot/queue' "$MODULE"
          grep -n 'requestJson' "$MODULE"
          grep -n 'candidateArrays' "$MODULE"
          grep -n 'queueItemsFromPayload' "$MODULE"
          grep -n 'writeRecoveredLocally' "$MODULE"
          grep -n 'installRecoveredFetchBridge' "$MODULE"
          grep -n 'persistRecoveredOffer' "$MODULE"
          grep -n 'recoverThenLoad' "$MODULE"
          grep -n 'installButtonRecovery' "$MODULE"
          grep -n 'phase24b4-direct-v9' radar/achou-levou-direct-v9.html

      - name: Garantir segurança
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b4-entry-v9.js
          grep -n 'supervised: true' "$MODULE"
          grep -n 'autoStart: false' "$MODULE"
          grep -n 'whatsappSend: false' "$MODULE"
          grep -n 'duplicateProtection: true' "$MODULE"
          ! grep -nE '/(queue/add|queue/start|fila/iniciar|bot/start|send-controlado)' "$MODULE"

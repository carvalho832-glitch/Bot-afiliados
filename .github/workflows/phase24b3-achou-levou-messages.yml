name: Fase 24B.3 Mensagens no Achou Levou

on:
  push:
    branches:
      - 'fix/phase24b4-direct-queue-v9'
    paths:
      - 'radar/modules/classic-achou-levou-phase24b3.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v9.js'
      - 'radar/achou-levou-direct-v9.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - '.github/workflows/phase24b3-achou-levou-messages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'radar/modules/classic-achou-levou-phase24b3.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v9.js'
      - 'radar/achou-levou-direct-v9.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - '.github/workflows/phase24b3-achou-levou-messages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar sintaxe e configuração
        run: |
          node --check radar/modules/classic-achou-levou-phase24b3.js
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v9.js
          python3 -m json.tool radar/config.json >/dev/null
          python3 -m json.tool radar/classic-config.json >/dev/null
          grep -n '2026.08.05.5-phase24b4-direct-queue-v9' radar/config.json
          grep -n 'classic-2026.08.05.16-phase24b4-direct-queue-v9' radar/classic-config.json
          grep -n 'classic-achou-levou-phase24b4-entry-v9.js?v=1' radar/classic-config.json
          grep -n 'achou-levou-direct-v9.html?v=1' radar/config.json
          grep -n '"phase24SupervisedMessages": true' radar/classic-config.json
          grep -n '"phase24SendWhatsapp": false' radar/classic-config.json

      - name: Validar salvamento e recuperação
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b3.js
          RECOVERY=radar/modules/classic-achou-levou-phase24b4-entry-v9.js
          grep -n '/gerar-mensagem' "$MODULE"
          grep -n '/phase24/batches' "$MODULE"
          grep -n '/shared/offers' "$MODULE"
          grep -n 'message-ready' "$MODULE"
          grep -n 'sourceId' "$MODULE"
          grep -n 'verified.offer' "$MODULE"
          grep -n 'Nada será enviado ao WhatsApp' "$MODULE"
          grep -n '/bot/queue' "$RECOVERY"
          grep -n 'persistRecoveredOffer' "$RECOVERY"
          grep -n "status: 'sent'" "$RECOVERY"
          grep -n 'recoverThenLoad' "$RECOVERY"

      - name: Garantir operação supervisionada
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b3.js
          RECOVERY=radar/modules/classic-achou-levou-phase24b4-entry-v9.js
          grep -n 'window.confirm' "$MODULE"
          grep -n 'pending\[0\]' "$MODULE"
          grep -n 'supervised: true' "$MODULE"
          grep -n 'autoStart: false' "$MODULE"
          grep -n 'sendsWhatsapp: false' "$MODULE"
          grep -n 'duplicateProtection: true' "$RECOVERY"
          ! grep -nE '/(queue/add|queue/start|fila/iniciar|bot/start|send-controlado)' "$RECOVERY"

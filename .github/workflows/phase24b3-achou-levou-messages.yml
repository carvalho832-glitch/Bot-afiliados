name: Fase 24B.3 Mensagens no Achou Levou

on:
  push:
    branches:
      - 'agent/phase24b3-achou-levou-messages'
      - 'agent/phase24b4-queue-repair'
      - 'fix/phase24b4-bootstrap-v6'
    paths:
      - 'radar/modules/classic-achou-levou-phase24b3.js'
      - 'radar/modules/classic-achou-levou-phase24b3-entry.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v5.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v6.js'
      - 'radar/achou-levou-bootstrap-v6.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - '.github/workflows/phase24b3-achou-levou-messages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'radar/modules/classic-achou-levou-phase24b3.js'
      - 'radar/modules/classic-achou-levou-phase24b3-entry.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v5.js'
      - 'radar/modules/classic-achou-levou-phase24b4-entry-v6.js'
      - 'radar/achou-levou-bootstrap-v6.html'
      - 'radar/config.json'
      - 'radar/classic-config.json'
      - '.github/workflows/phase24b3-achou-levou-messages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: |
          node --check radar/modules/classic-achou-levou-phase24b3.js
          node --check radar/modules/classic-achou-levou-phase24b3-entry.js
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v5.js
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v6.js

      - name: Validar configuração remota
        run: |
          python3 -m json.tool radar/config.json >/dev/null
          python3 -m json.tool radar/classic-config.json >/dev/null
          grep -n '2026.08.05.2-phase24b4-bootstrap-v6' radar/config.json
          grep -n 'classic-2026.08.05.13-phase24b4-bootstrap-v6' radar/classic-config.json
          grep -n 'classic-achou-levou-phase24b4-entry-v6.js?v=1' radar/classic-config.json
          grep -n 'achou-levou-bootstrap-v6.html?v=1' radar/config.json
          grep -n '"phase24SupervisedMessages": true' radar/classic-config.json
          grep -n '"phase24MessagesOneAtATime": true' radar/classic-config.json
          grep -n '"phase24VerifiedAchouLevouSave": true' radar/classic-config.json
          grep -n '"phase24SendWhatsapp": false' radar/classic-config.json

      - name: Validar salvamento confirmado
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b3.js
          grep -n '/gerar-mensagem' "$MODULE"
          grep -n '/phase24/batches' "$MODULE"
          grep -n '/shared/offers' "$MODULE"
          grep -n 'message-ready' "$MODULE"
          grep -n 'sourceId' "$MODULE"
          grep -n 'verified.offer' "$MODULE"
          grep -n 'Nada será enviado ao WhatsApp' "$MODULE"

      - name: Garantir operação supervisionada
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b3.js
          grep -n 'window.confirm' "$MODULE"
          grep -n 'pending\[0\]' "$MODULE"
          grep -n 'supervised: true' "$MODULE"
          grep -n 'autoStart: false' "$MODULE"
          grep -n 'sendsWhatsapp: false' "$MODULE"
          ! grep -nE '/(queue/start|fila/iniciar|bot/start|send-controlado)' "$MODULE"

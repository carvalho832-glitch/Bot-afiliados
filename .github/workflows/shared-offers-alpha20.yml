name: Validar fila compartilhada Alpha 20

on:
  push:
    branches:
      - 'agent/shared-offers-alpha20'
      - 'fix/shared-offers-alpha20-live'
      - 'agent/verified-bot-queue-phase21'
    paths:
      - 'api/shared-offers-preload.js'
      - 'api/package.json'
      - 'api/test/shared-offers.test.mjs'
      - 'shared-offers-client.js'
      - 'radar/modules/classic-achou-levou.js'
      - 'radar/classic-config.json'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/shared-offers-alpha20.yml'
  pull_request:
    paths:
      - 'api/shared-offers-preload.js'
      - 'api/package.json'
      - 'api/test/shared-offers.test.mjs'
      - 'shared-offers-client.js'
      - 'radar/modules/classic-achou-levou.js'
      - 'radar/classic-config.json'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/shared-offers-alpha20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências sem baixar navegador
        working-directory: api
        run: npm install --ignore-scripts

      - name: Validar sintaxe da API
        working-directory: api
        run: npm run check

      - name: Validar módulos do navegador
        run: |
          node --check shared-offers-client.js
          node --check radar/modules/classic-achou-levou.js
          node --check sw.js
          grep -Eq 'shared-offers-client\.js\?v=[0-9]+' index.html
          grep -Eq '"release": "classic-[^"]+"' radar/classic-config.json
          grep -q '"sharedQueueApi": true' radar/classic-config.json
          grep -q '"verifiedSave": true' radar/classic-config.json

      - name: Testar fila compartilhada
        working-directory: api
        run: node --test test/shared-offers.test.mjs

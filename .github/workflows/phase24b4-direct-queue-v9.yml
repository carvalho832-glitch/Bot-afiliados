name: Fase 24B.4 Fila direta V9

on:
  push:
    branches:
      - 'fix/phase24b4-direct-queue-v9'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript e JSON
        run: |
          node --check radar/modules/classic-achou-levou-phase24b4-entry-v9.js
          python3 -m json.tool radar/config.json >/dev/null
          python3 -m json.tool radar/classic-config.json >/dev/null
      - name: Validar rota direta
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b4-entry-v9.js
          grep -n '/bot/queue' "$MODULE"
          grep -n 'recoverThenLoad' "$MODULE"
          grep -n 'installButtonRecovery' "$MODULE"
          grep -n 'stopImmediatePropagation' "$MODULE"
          grep -n 'queueItemsFromPayload' "$MODULE"
          grep -n 'phase24b4-recovered-from-bot-queue-v9' "$MODULE"
      - name: Bloquear envio automático
        run: |
          MODULE=radar/modules/classic-achou-levou-phase24b4-entry-v9.js
          ! grep -nE '/(queue/add|queue/start|send-controlado)' "$MODULE"
          grep -n 'autoStart: false' "$MODULE"
          grep -n 'whatsappSend: false' "$MODULE"

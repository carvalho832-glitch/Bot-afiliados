name: Resolver Shopee via navegador temporariamente

on:
  push:
    branches:
      - chore/resolve-offer-links
    paths:
      - '.github/scripts/resolve_shopee_browser.mjs'
      - '.github/workflows/resolve-shopee-browser-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar navegador
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Resolver links Shopee
        run: node .github/scripts/resolve_shopee_browser.mjs
      - name: Publicar resultado
        uses: actions/upload-artifact@v4
        with:
          name: resolved-shopee-browser
          path: tmp/resolved-shopee-browser.json
          retention-days: 1

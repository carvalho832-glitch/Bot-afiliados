name: Resolve offer links

on:
  push:
    branches:
      - analysis/resolve-offer-links
    paths:
      - '.github/workflows/resolve-offer-links.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Shopee product metadata
        shell: bash
        run: |
          set +e
          u='https://s.shopee.com.br/3qN5HrtUez'
          curl -L -sS --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/121 Safari/537.36' -D /tmp/h.txt -o /tmp/page.html -w 'HTTP=%{http_code}\nFINAL=%{url_effective}\nSIZE=%{size_download}\n' "$u"
          echo '=== HEADERS ==='
          grep -Ei '^(HTTP/|content-type:|location:)' /tmp/h.txt | tail -20
          echo '=== HTML META ==='
          python3 - <<'PY'
          from pathlib import Path
          import re,html,json
          s=Path('/tmp/page.html').read_text('utf-8',errors='ignore')
          print('LEN',len(s))
          for label,pat in [
            ('TITLE',r'<title[^>]*>(.*?)</title>'),
            ('OG_TITLE',r'<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)'),
            ('DESCRIPTION',r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']+)'),
          ]:
            m=re.search(pat,s,re.I|re.S)
            print(label,html.unescape(re.sub(r'\s+',' ',m.group(1))).strip()[:500] if m else 'NOT_FOUND')
          for key in ['price_before_discount','price_min_before_discount','price','price_min','name','historical_sold','discount']:
            vals=re.findall(r'"'+re.escape(key)+r'"\s*:\s*(".*?"|-?\d+(?:\.\d+)?|null)',s,re.I)
            print(key, vals[:10])
          print('JSONLD')
          for block in re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',s,re.I|re.S)[:5]:
            print(html.unescape(re.sub(r'\s+',' ',block)).strip()[:1800])
          PY

                  m=re.search(r'/([0-9]+)/([0-9]+)(?:\?|$)',final)
                  if m:
                      print(f'SHOPEE|{i}|{u}|{m.group(1)}|{m.group(2)}')
                      break
                  time.sleep(1.5*(attempt+1))
              else:
                  print(f'SHOPEE|{i}|{u}|ERROR|NO_IDS')
              time.sleep(0.7)

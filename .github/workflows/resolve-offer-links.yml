                  m=re.search(r'/([0-9]+)/([0-9]+)(?:\?|$)',final)
                  if m: return (i,f'SHOPEE|{i}|{u}|{m.group(1)}|{m.group(2)}')
                  return (i,f'SHOPEE|{i}|{u}|ERROR|NO_IDS')
              except Exception as e:
                  return (i,f'SHOPEE|{i}|{u}|ERROR|{type(e).__name__}')
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              rows=list(ex.map(one,enumerate(links,1)))
          for _,row in sorted(rows): print(row)
          PY

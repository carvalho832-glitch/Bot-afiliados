name: Resolve offer links

on:
  push:
    branches:
      - analysis/resolve-offer-links
    paths:
      - '.github/workflows/resolve-offer-links.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect rendered Shopee price fields
        shell: bash
        run: |
          u='https://s.shopee.com.br/3qN5HrtUez'
          chrome=$(command -v google-chrome)
          "$chrome" --headless --disable-gpu --no-sandbox --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom "$u" > /tmp/dom.html 2>/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re,html
          s=Path('/tmp/dom.html').read_text('utf-8',errors='ignore')
          print('=== NON-NULL PRICE-LIKE FIELDS ===')
          pairs=[]
          for m in re.finditer(r'\\?"([^"\\]{0,80}(?:price|discount)[^"\\]{0,80})\\?"\s*:\s*(?:\\?"([^"\\]{1,120})\\?"|(-?\d+(?:\.\d+)?|true|false|null))',s,re.I):
              k=m.group(1); v=m.group(2) or m.group(3)
              if v!='null' and (k,v) not in pairs: pairs.append((k,v))
          for k,v in pairs[:250]: print(f'{k}={v}')
          print('=== CURRENCY/AMOUNT CONTEXT ===')
          for pat in ['BRL','show_discount','raw_discount','coin_earn','price_min','price_before_discount']:
              print('PATTERN',pat)
              for m in list(re.finditer(pat,s,re.I))[:15]:
                  a=max(0,m.start()-250); b=min(len(s),m.end()+350)
                  print(re.sub(r'\s+',' ',html.unescape(s[a:b]))[:650])
          PY

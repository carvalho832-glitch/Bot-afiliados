name: Resolve offer links

on:
  push:
    branches:
      - analysis/resolve-offer-links
    paths:
      - '.github/workflows/resolve-offer-links.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect visible prices
        shell: bash
        run: |
          url='https://shopee.com.br/Kit-Parafusadeira-Domestica-com-maleta-Leve-Portatil-USB-Recarregavel-YUMI-i.1025824477.23193562548'
          chrome=$(command -v google-chrome)
          "$chrome" --headless --disable-gpu --no-sandbox --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "$url" > /tmp/dom.html 2>/tmp/err
          python3 - <<'PY'
          from pathlib import Path
          import re,html
          s=Path('/tmp/dom.html').read_text('utf8',errors='ignore')
          print('LEN',len(s))
          text=html.unescape(re.sub(r'<[^>]+>','\n',s))
          lines=[re.sub(r'\s+',' ',x).strip() for x in text.splitlines() if x.strip()]
          for i,x in enumerate(lines):
              if 'R$' in x or re.search(r'\b\d{1,4}[,.]\d{2}\b',x):
                  print('PRICE_LINE',i,x[:1000])
          for pat in [r'R\$\s*[0-9.,]+',r'"price"\s*:\s*[^,}]+',r'"price_before_discount"\s*:\s*[^,}]+',r'"show_discount"\s*:\s*[^,}]+']:
              vals=[]
              for m in re.finditer(pat,s,re.I):
                  v=m.group(0)
                  if v not in vals: vals.append(v)
              print('PATTERN',pat,vals[:30])
          PY

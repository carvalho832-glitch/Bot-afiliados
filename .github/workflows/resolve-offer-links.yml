name: Resolve offer links

on:
  push:
    branches:
      - analysis/resolve-offer-links
    paths:
      - '.github/workflows/resolve-offer-links.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Render Mercado Livre affiliate landing
        shell: bash
        run: |
          set +e
          u='https://meli.la/33vCDqb'
          echo '=== CHROME ==='
          which google-chrome || which chromium || which chromium-browser || true
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -n "$chrome" ]; then
            "$chrome" --headless --disable-gpu --no-sandbox --virtual-time-budget=10000 --dump-dom "$u" > /tmp/dom.html 2>/tmp/chrome.err
            echo '=== DOM SIZE ==='
            wc -c /tmp/dom.html
            echo '=== TITLE ==='
            grep -Eio '<title[^>]*>[^<]{0,300}' /tmp/dom.html | head -5
            echo '=== PRODUCT URLS ==='
            grep -Eo 'https?://[^"'"' <>]+' /tmp/dom.html | grep -Ei 'mercadolivre.*(MLB|produto|p/)' | sed 's/&amp;/\&/g' | sort -u | head -50
            echo '=== MLB IDS ==='
            grep -Eio 'MLB-?[0-9]{6,}' /tmp/dom.html | sort -u | head -50
            echo '=== TEXT HINTS ==='
            sed 's/<[^>]*>/\n/g' /tmp/dom.html | sed 's/&nbsp;/ /g;s/&amp;/\&/g' | grep -v '^$' | head -100
          fi

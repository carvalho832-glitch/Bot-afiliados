name: Resolve offer links

on:
  push:
    branches:
      - analysis/resolve-offer-links
    paths:
      - '.github/workflows/resolve-offer-links.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect unresolved Shopee short link
        shell: bash
        run: |
          set +e
          u='https://s.shopee.com.br/3LQogwvOfu'
          for ua in \
            'Mozilla/5.0 (Linux; Android 16; SM-S901E) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' \
            'Shopee Android app' \
            'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'; do
            echo "=== UA: $ua ==="
            curl -sS --max-time 20 -A "$ua" -D /tmp/h.txt -o /tmp/b.html "$u"
            grep -Ei '^(HTTP/|location:|set-cookie:|content-type:)' /tmp/h.txt | head -30
            echo BODY_SIZE=$(wc -c < /tmp/b.html)
            python3 - <<'PY'
          from pathlib import Path
          import re,html
          s=Path('/tmp/b.html').read_text('utf-8',errors='ignore')
          for pat in [r'https?://[^"\'<> ]+',r'(?:shop|item)[_ -]?id[^<]{0,120}',r'product/[0-9]+/[0-9]+',r'i\.[0-9]+\.[0-9]+']:
              vals=[]
              for x in re.findall(pat,s,re.I):
                  x=html.unescape(x if isinstance(x,str) else ''.join(x))
                  if x not in vals: vals.append(x)
              print(pat, vals[:20])
          print(s[:1000].replace('\n',' '))
          PY
          done

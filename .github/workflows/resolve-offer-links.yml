name: Resolve offer links

on:
  push:
    branches:
      - analysis/resolve-offer-links
    paths:
      - '.github/workflows/resolve-offer-links.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve all Mercado Livre links
        shell: bash
        run: |
          cat > /tmp/ml.txt <<'EOF'
          https://meli.la/33vCDqb
          https://meli.la/14XY5Pw
          https://meli.la/1Day7Ga
          https://meli.la/2pHYrtA
          https://meli.la/2V4Z2pv
          https://meli.la/1DN1ucJ
          https://meli.la/1eaZ9in
          https://meli.la/1AxaZSy
          https://meli.la/2hgs7zg
          https://meli.la/259bnM8
          https://meli.la/1dAdwyB
          https://meli.la/2tPNsMf
          https://meli.la/1BzjHso
          https://meli.la/2Qg9ifj
          https://meli.la/1TKPkSm
          https://meli.la/2ia3AQL
          https://meli.la/2rDiJJy
          https://meli.la/2XJ1LNf
          https://meli.la/2ruaM3D
          https://meli.la/2UztGx8
          https://meli.la/27aemax
          https://meli.la/1Jg2f4E
          https://meli.la/2oNewqb
          https://meli.la/2kT3Ben
          https://meli.la/2AC9J9E
          https://meli.la/2q1CnFe
          https://meli.la/1fGyVi2
          EOF
          python3 - <<'PY'
          import subprocess,re,concurrent.futures,html
          links=[x.strip() for x in open('/tmp/ml.txt') if x.strip()]
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36'
          def one(pair):
              i,u=pair
              try:
                  p=subprocess.run(['curl','-L','-sS','--max-time','30','-A',ua,'-H','Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',u],capture_output=True,text=True,timeout=35)
                  s=p.stdout
                  m=re.search(r'<ul class="ui-recommendations-list__items-wrapper--single"[\s\S]*?</ul>',s,re.I)
                  if not m: return (i,f'ML|{i}|{u}|ERROR|SECTION_NOT_FOUND')
                  sec=m.group(0)
                  pm=re.search(r'https://(?:produto|www)\.mercadolivre\.com\.br/[^"\' ]*MLB-?\d+[^"\' ]*',sec,re.I)
                  url=html.unescape(pm.group(0)).split('?')[0].split('#')[0] if pm else 'URL_NOT_FOUND'
                  text=html.unescape(re.sub(r'<[^>]+>',' ',sec))
                  text=re.sub(r'\s+',' ',text).strip().replace('|','/')
                  return (i,f'ML|{i}|{u}|{url}|{text[:1000]}')
              except Exception as e:
                  return (i,f'ML|{i}|{u}|ERROR|{type(e).__name__}')
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              rows=list(ex.map(one,enumerate(links,1)))
          for _,row in sorted(rows): print(row)
          PY

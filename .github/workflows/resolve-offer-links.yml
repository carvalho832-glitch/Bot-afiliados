name: Resolve offer links

on:
  push:
    branches:
      - analysis/resolve-offer-links
    paths:
      - '.github/workflows/resolve-offer-links.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Mercado Livre social target
        shell: bash
        run: |
          set -e
          u='https://meli.la/33vCDqb'
          curl -L -sS --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36' -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' -o /tmp/page.html "$u"
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('/tmp/page.html').read_text('utf-8',errors='ignore')
          m=re.search(r'<ul class="ui-recommendations-list__items-wrapper--single"[\s\S]*?</ul>',s,re.I)
          print('SECTION_FOUND', bool(m))
          if m:
              sec=m.group(0)
              p=re.search(r'https://(?:produto|www)\.mercadolivre\.com\.br/[^"\' ]*MLB-?\d+[^"\' ]*',sec,re.I)
              print('PRODUCT_URL', html.unescape(p.group(0)) if p else 'NOT_FOUND')
              text=html.unescape(re.sub(r'<[^>]+>',' ',sec))
              print('SECTION_TEXT',re.sub(r'\s+',' ',text).strip()[:1500])
          PY

name: Resolve offer links

on:
  push:
    branches:
      - analysis/resolve-offer-links
    paths:
      - '.github/workflows/resolve-offer-links.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Render Shopee test item
        shell: bash
        run: |
          set +e
          u='https://s.shopee.com.br/3qN5HrtUez'
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          echo "CHROME=$chrome"
          "$chrome" --headless --disable-gpu --no-sandbox --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom "$u" > /tmp/dom.html 2>/tmp/chrome.err
          echo '=== DOM SIZE ==='
          wc -c /tmp/dom.html
          echo '=== CHROME ERR TAIL ==='
          tail -30 /tmp/chrome.err || true
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('/tmp/dom.html').read_text('utf-8',errors='ignore')
          print('=== TITLE ===')
          m=re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S)
          print(html.unescape(re.sub(r'\s+',' ',m.group(1))).strip()[:500] if m else 'NO_TITLE')
          print('=== TEXT WITH PRICE/KNOWN TERMS ===')
          text=re.sub(r'<script.*?</script>','\n',s,flags=re.I|re.S)
          text=re.sub(r'<style.*?</style>','\n',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>','\n',text))
          lines=[re.sub(r'\s+',' ',x).strip() for x in text.splitlines()]
          lines=[x for x in lines if x]
          chosen=[]
          for x in lines:
              low=x.lower()
              if ('r$' in low or 'brit' in low or 'aspir' in low or 'desconto' in low or 'off' in low or 'vendid' in low) and x not in chosen:
                  chosen.append(x)
          for x in chosen[:150]: print(x[:700])
          print('=== ITEMID CONTEXT ===')
          target='20298661096'
          for m in list(re.finditer(target,s))[:20]:
              a=max(0,m.start()-500); b=min(len(s),m.end()+1000)
              print(re.sub(r'\s+',' ',html.unescape(s[a:b]))[:1800])
          PY

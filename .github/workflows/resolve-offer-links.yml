          EOF
          python3 - <<'PY'
          import subprocess,re,urllib.parse
          links=[x.strip() for x in open('/tmp/links.txt') if x.strip()]
          ua='Shopee Android app'
          for i,u in enumerate(links,1):
              p=subprocess.run(['curl','-sS','--max-time','20','-A',ua,'-D','-','-o','/dev/null',u],capture_output=True,text=True,timeout=25)
              m=re.search(r'^location:\s*(\S+)',p.stdout,re.I|re.M)
              loc=m.group(1).strip() if m else ''
              decoded=urllib.parse.unquote(loc)
              ids=re.search(r'-i\.([0-9]+)\.([0-9]+)',decoded)
              title=''
              if ids:
                  path=urllib.parse.urlparse(decoded).path.rsplit('-i.',1)[0].lstrip('/')
                  title=path.replace('-',' ')
              print(f'SHOPEE|{i}|{u}|{ids.group(1) if ids else ""}|{ids.group(2) if ids else ""}|{title}|{loc}')
          PY

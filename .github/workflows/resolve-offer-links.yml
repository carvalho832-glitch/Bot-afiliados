          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/121 Safari/537.36'
          for offset,u in enumerate(batch):
              i=g*5+offset+1
              final=''
              for attempt in range(3):
                  p=subprocess.run(['curl','-L','-sS','--max-time','25','-A',ua,'-o','/dev/null','-w','%{url_effective}',u],capture_output=True,text=True,timeout=30)

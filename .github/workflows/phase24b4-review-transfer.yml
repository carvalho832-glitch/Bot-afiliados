name: Fase 24B.4 Revisão e transferência

on:
  push:
    branches:
      - 'agent/phase24b4-review-transfer'
    paths:
      - 'api/phase24-reviews-preload.js'
      - 'api/package.json'
      - 'api/test/phase24-reviews.test.mjs'
      - 'radar/classic-config.json'
      - 'radar/modules/classic-achou-levou-phase24b4*.js'
      - '.github/workflows/phase24b4-review-transfer.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api/phase24-reviews-preload.js'
      - 'api/package.json'
      - 'api/test/phase24-reviews.test.mjs'
      - 'radar/classic-config.json'
      - 'radar/modules/classic-achou-levou-phase24b4*.js'
      - '.github/workflows/phase24b4-review-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase24b4-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: api
        run: npm install --ignore-scripts

      - name: Validar sintaxe
        run: |
          node --check api/phase24-reviews-preload.js
          node --check radar/modules/classic-achou-levou-phase24b4.js
          node --check radar/modules/classic-achou-levou-phase24b4-entry.js

      - name: Testar persistência da revisão
        working-directory: api
        run: node --test test/phase24-reviews.test.mjs

      - name: Validar revisão antes do robô
        run: |
          grep -n 'phase24PersistentReview' radar/classic-config.json
          grep -n 'phase24ReviewBeforeBot' radar/classic-config.json
          grep -n 'phase24VerifiedBotTransfer' radar/classic-config.json
          grep -n 'phase24BotQueueStaysPaused' radar/classic-config.json
          grep -n 'transfer.transferOffers' radar/modules/classic-achou-levou-phase24b4.js
          grep -n "statusFor(offer.sourceId) !== 'approved'" radar/modules/classic-achou-levou-phase24b4.js
          grep -n "saveReview(offer.sourceId, 'sent'" radar/modules/classic-achou-levou-phase24b4.js

      - name: Garantir ausência de disparo automático
        run: |
          ! grep -nE 'startQueue\(|iniciarFila\(|ativar.*envio|sendWhatsapp\(' radar/modules/classic-achou-levou-phase24b4.js
          grep -n 'phase24AutoTransfer.*false' radar/classic-config.json
          grep -n 'phase24AutoStart.*false' radar/classic-config.json

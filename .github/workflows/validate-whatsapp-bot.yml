name: Validar bot WhatsApp

on:
  push:
    branches:
      - fix/grupos-fila-robusta
  pull_request:
    paths:
      - 'whatsapp-bot/**'
      - '.github/workflows/validate-whatsapp-bot.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-bot

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: whatsapp-bot/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar sintaxe
        run: npm run check

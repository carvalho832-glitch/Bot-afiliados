<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achou Levou - Afiliados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>ACHOU LEVOU 🚀</h1>
        </header>

        <div class="input-box">
            <label>📱 Postar em qual grupo?</label>
            <select id="select-grupo">
                <option value="Achou Levou 🚀">Achou Levou 🚀</option>
                <option value="Oferta Bruta 🔨">Oferta Bruta 🔨</option>
            </select>

            <label>Link do produto</label>
            <input type="text" id="input-link" placeholder="Cole o link da Amazon ou ML aqui...">
            
            <button id="btn-puxar">PUXAR DADOS</button>
        </div>

        <div class="actions">
            <button id="btn-gerar" class="orange-btn">GERAR MENSAGEM</button>
            <button id="btn-salvar" class="blue-btn">💾 SALVAR NO ARQUIVO</button>
        </div>

        <div class="fields-grid">
            <div class="field">
                <label>Produto</label>
                <input type="text" id="display-produto" readonly>
            </div>
            <div class="row">
                <div class="field">
                    <label>De:</label>
                    <input type="text" id="display-de" placeholder="R$ 0,00">
                </div>
                <div class="field">
                    <label>Por:</label>
                    <input type="text" id="display-por" placeholder="R$ 0,00" class="highlight-price">
                </div>
            </div>
            <div class="field">
                <label>🎫 Cupom</label>
                <input type="text" id="display-cupom" placeholder="Ex: COMPRANOAPP">
            </div>
        </div>

        <div class="message-output-box">
            <p id="msg-preview">Aguardando geração...</p>
        </div>

        <div id="lista-salvas"></div>

        <button id="btn-limpar-campos" class="red-btn">🗑️ LIMPAR CAMPOS</button>
    </div>

    <div id="loader-global" class="loader-overlay" style="display: none;">
        <div class="loader-card">
            <div class="robot-and-bubble">
                <div class="speech-bubble">
                    <span class="typewriter">Pescando a oferta...</span>
                </div>
                <div class="robot-vector">
                  <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
                    <circle cx="25" cy="25" r="23" stroke="#f97316" stroke-width="2" fill="#161b22"/>
                    <rect x="15" y="15" width="20" height="20" rx="3" fill="#30363d"/>
                    <circle cx="20" cy="21" r="2" fill="#f97316"/>
                    <circle cx="30" cy="21" r="2" fill="#f97316"/>
                    <rect x="19" y="27" width="12" height="4" rx="1" fill="#8b949e"/>
                    <path d="M 23,8 V 15" stroke="#f97316" stroke-width="2"/>
                    <path d="M 12,23 L 15,25 L 12,27 V 23 Z" fill="#f97316"/>
                  </svg>
                </div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-animated"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

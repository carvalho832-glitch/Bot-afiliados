<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Achou Levou 🚀</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9800">
</head>
<body>

<div class="app-card">
    <div id="loader-global" class="loader-overlay" style="display:none;">
        <div class="loader-content">
            <div class="robot-icon">🤖</div>
            <p id="loader-text">Iniciando protocolo...</p>
            <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>
    </div>

    <header class="header-banner">
        <h1 id="titulo-dinamico">Achou Levou 🚀</h1>
    </header>

    <main class="app-body">
        <div class="input-group">
            <label>📱 Postar em qual grupo?</label>
            <select id="select-grupo" class="main-input">
                <option value="Achou Levou">Achou Levou 🚀</option>
                <option value="Oferta Bruta">Oferta Bruta 🔥</option>
            </select>
        </div>

        <div class="input-group">
            <label>Link do produto</label>
            <input type="text" id="input-link" placeholder="Cole o link aqui..." class="main-input">
        </div>

        <button class="btn-dark" id="btn-puxar">PUXAR DADOS</button>
        <button class="btn-orange-grad" id="btn-gerar">GERAR MENSAGEM</button>
        <button class="btn-save" id="btn-salvar">💾 SALVAR NO ARQUIVO</button>

        <div class="input-group">
            <label>Produto</label>
            <input type="text" id="display-produto" placeholder="..." class="main-input readonly" readonly>
        </div>

        <div class="grid-row" style="display:flex; gap:10px;">
            <div class="input-group" style="flex:1;">
                <label>De:</label>
                <input type="text" id="display-de" placeholder="R$ 0,00" class="main-input">
            </div>
            <div class="input-group" style="flex:1;">
                <label>Por:</label>
                <input type="text" id="display-por" placeholder="R$ 0,00" class="main-input" style="color:#ff9800; font-weight:bold;">
            </div>
        </div>

        <div class="input-group">
            <label>🎫 Cupom</label>
            <input type="text" id="display-cupom" placeholder="Ex: COMPRANOAPP" class="main-input">
        </div>

        <div class="message-output-box">
            <p>Aguardando geração...</p>
        </div>

        <div class="saved-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0; font-size: 16px; color: #ff9800;">📌 Ofertas Fixadas</h3>
                <button id="limpar-historico" style="width: auto; background: #4b5563; padding: 5px 10px; font-size: 10px;">APAGAR TUDO</button>
            </div>
            <div id="lista-salvas"></div>
        </div>

        <button class="btn-danger" id="btn-limpar-campos">LIMPAR CAMPOS 🗑️</button>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>

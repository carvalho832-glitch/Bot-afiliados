<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achou Levou 🚀</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117" id="meta-theme-color">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css?v=10">
    <link rel="stylesheet" href="progress-style.css?v=10">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div>
                <p class="eyebrow">Central de ofertas</p>
                <h1>ACHOU LEVOU 🚀</h1>
            </div>
            <button id="btn-tema" class="theme-toggle" type="button" aria-label="Alternar modo claro ou escuro">🌙</button>
        </header>

        <section class="card input-box">
            <label for="select-grupo">📱 Postar em qual grupo?</label>
            <select id="select-grupo">
                <option value="Achou Levou 🚀">Achou Levou 🚀</option>
                <option value="Oferta Bruta 🔨">Oferta Bruta 🔨</option>
            </select>

            <label for="input-link">Link do produto</label>
            <input type="text" id="input-link" placeholder="Cole o link da Shopee, Mercado Livre ou Amazon aqui...">

            <button id="btn-puxar" class="green-btn" type="button">🔎 PUXAR DADOS</button>
        </section>

        <section class="card fields-grid">
            <div class="field">
                <label for="display-produto">Produto</label>
                <input type="text" id="display-produto" readonly placeholder="O nome do produto aparece aqui">
            </div>

            <div class="row">
                <div class="field">
                    <label for="display-de">De:</label>
                    <input type="text" id="display-de" placeholder="R$ 0,00">
                </div>
                <div class="field">
                    <label for="display-por">Por:</label>
                    <input type="text" id="display-por" placeholder="R$ 0,00" class="highlight-price">
                </div>
            </div>

            <div class="field">
                <label for="display-cupom">🎫 Cupom</label>
                <input type="text" id="display-cupom" placeholder="Ex: COMPRANOAPP">
            </div>
        </section>

        <div class="actions">
            <button id="btn-gerar" class="orange-btn" type="button">✨ GERAR MENSAGEM</button>
            <button id="btn-copiar" class="copy-btn" type="button">📋 COPIAR MENSAGEM</button>
            <button id="btn-salvar" class="blue-btn" type="button">💾 SALVAR NO ARQUIVO</button>
        </div>

        <section class="message-output-box" aria-live="polite">
            <p id="msg-preview">Aguardando geração...</p>
        </section>

        <section class="saved-section">
            <div class="section-title">
                <span>📁 Ofertas salvas</span>
                <small>histórico no celular</small>
            </div>
            <div id="lista-salvas"></div>
        </section>

        <button id="btn-limpar-campos" class="red-btn" type="button">🗑️ LIMPAR CAMPOS</button>
    </div>

    <div id="loader-global" class="loader-overlay" style="display: none;">
        <div class="loader-card tech-loader-card">
            <div class="tech-grid"></div>
            <div class="scan-line"></div>

            <div class="loader-status-pill">
                <span class="status-dot"></span>
                IA garimpando oferta
            </div>

            <div class="tech-robot-stage">
                <div class="holo-ring ring-one"></div>
                <div class="holo-ring ring-two"></div>
                <div class="data-orbit orbit-one"></div>
                <div class="data-orbit orbit-two"></div>

                <div class="tech-robot">
                    <div class="robot-antenna"></div>
                    <div class="robot-head">
                        <div class="robot-visor">
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                    <div class="robot-neck"></div>
                    <div class="robot-body">
                        <div class="robot-core"></div>
                    </div>
                </div>
            </div>

            <p class="loader-title" id="loader-title">Analisando produto...</p>
            <p class="loader-subtitle" id="loader-subtitle">preparando captura de dados</p>

            <div class="progress-bar-container tech-progress" id="loader-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="loader-progress-bar" class="progress-bar-animated" style="width: 0%;"></div>
            </div>

            <div class="loader-progress-meta">
                <span id="loader-progress-text">0%</span>
                <span id="loader-progress-phase">iniciando</span>
            </div>
        </div>
    </div>

    <script src="script.js?v=10"></script>
    <script src="progress-loader.js?v=10"></script>
    <script src="product-image.js?v=10"></script>
    <script src="enhancements.js?v=10"></script>
    <script src="image-card-fix.js?v=10"></script>
    <script src="bulk-whatsapp.js?v=10"></script>
    <script src="shopee-helper.js?v=10"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=10')
                    .then(reg => {
                        console.log('PWA ativado!', reg);
                        reg.update();
                    })
                    .catch(err => console.log('Falha no PWA:', err));
            });
        }
    </script>
</body>
</html>
